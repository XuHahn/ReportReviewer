server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri /index.html; }
    location /api/ {
        proxy_pass http://emc-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        client_max_body_size 110m;
    }
    location /docs { proxy_pass http://emc-backend:8000; proxy_set_header Host $host; }
    location /openapi.json { proxy_pass http://emc-backend:8000; proxy_set_header Host $host; }
}
